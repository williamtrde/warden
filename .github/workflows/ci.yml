name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Install dev tools
        run: brew install xcodegen swiftlint
      - name: Lint
        run: swiftlint
      - name: Test core
        run: swift test
      - name: Build app (unsigned, universal)
        run: scripts/build-app.sh
