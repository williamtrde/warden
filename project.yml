name: Warden
options:
  bundleIdPrefix: com.williamtaride
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
packages:
  WardenCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Warden:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: WardenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.williamtaride.warden
        PRODUCT_NAME: Warden
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Warden.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        OTHER_LDFLAGS: ["-weak_framework", "FoundationModels"]
      configs:
        # Keeps get-task-allow out of Release: notarization rejects it.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
